<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="A calm, phone-friendly personal task dashboard.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Personal Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252923;
      --muted: #697168;
      --paper: #fffefa;
      --canvas: #f3f0e8;
      --line: #dedbd1;
      --today: #d1e5f9;
      --week: #d6efd6;
      --month: #f9eacc;
      --shopping: #f5ddcf;
      --bible: #eadbf4;
      --data: #dfe5df;
      --accent: #315f4b;
      --shadow: 0 10px 30px rgba(45, 52, 45, .08);
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,.8), transparent 38%),
        var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }

    button, select, input[type="checkbox"] { touch-action: manipulation; }

    .app {
      width: min(100%, 620px);
      min-height: 100vh;
      margin: 0 auto;
      background: rgba(255, 254, 250, .92);
      box-shadow: var(--shadow);
    }

    header {
      padding: max(18px, env(safe-area-inset-top)) 18px 13px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.55rem, 7vw, 2.05rem);
      font-weight: 700;
      letter-spacing: -.025em;
    }

    #saveStatus {
      flex: 0 0 8.5rem;
      color: var(--muted);
      font-size: .78rem;
      text-align: right;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 11px 14px;
      background: rgba(255, 254, 250, .96);
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    nav::-webkit-scrollbar { display: none; }

    .tab {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-weight: 650;
      white-space: nowrap;
    }

    .tab[aria-selected="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    main { padding: 16px 14px calc(28px + env(safe-area-inset-bottom)); }

    .panel { display: none; }
    .panel.active { display: block; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 16px 17px;
      border-radius: 18px;
    }

    .section-head h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      letter-spacing: -.015em;
    }

    .section-head span {
      color: rgba(37, 41, 35, .66);
      font-size: .8rem;
      font-weight: 650;
    }

    .today .section-head { background: var(--today); }
    .week .section-head { background: var(--week); }
    .month .section-head { background: var(--month); }
    .shopping .section-head { background: var(--shopping); }
    .bible .section-head { background: var(--bible); }
    .data .section-head { background: var(--data); }

    .task-list { display: grid; gap: 10px; }

    .task {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 66px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      transition: opacity .18s ease, background .18s ease;
    }

    .task.done { opacity: .48; background: #f2f1ec; }
    .task.done .task-control { text-decoration: line-through; }

    .coming-up {
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .coming-up-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 10px;
    }

    .coming-up-head h3 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.18rem;
    }

    .coming-up-head span { color: var(--muted); font-size: .78rem; }

    .coming-list { display: grid; gap: 10px; }

    .coming-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 104px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      transition: opacity .18s ease, background .18s ease;
    }

    .coming-item.done { opacity: .48; background: #f2f1ec; }
    .coming-item.done .coming-text { text-decoration: line-through; }

    .coming-fields { display: grid; gap: 7px; min-width: 0; }

    .coming-text, .coming-date {
      width: 100%;
      height: 42px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #cbc9c0;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
    }

    .coming-date { color: var(--muted); }

    .check {
      width: 27px;
      height: 27px;
      margin: 0;
      accent-color: var(--accent);
    }

    .task-body { min-width: 0; }

    .day-label {
      display: block;
      margin: 0 0 5px 2px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .task-control {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid #cbc9c0;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font-size: 1rem;
    }

    select.task-control { padding-right: 34px; }

    .helper {
      margin: -4px 3px 16px;
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.4;
    }

    .reading-legend {
      display: grid;
      gap: 7px;
      margin: -3px 3px 16px;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.35;
    }

    .legend-item { display: flex; align-items: center; gap: 8px; }

    .reading-marker {
      display: inline-block;
      flex: 0 0 auto;
      width: 11px;
      height: 11px;
    }

    .history-marker {
      background: #c84949;
      transform: rotate(45deg);
      border-radius: 1px;
    }

    .congregation-marker {
      background: #3975bd;
      border-radius: 50%;
    }

    .reading-groups { display: grid; gap: 10px; }

    .reading-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      scroll-margin-top: 74px;
    }

    .reading-group summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside;
    }

    .reading-group[open] summary {
      background: color-mix(in srgb, var(--bible) 58%, white);
      border-bottom: 1px solid var(--line);
    }

    .group-progress {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .reading-list { display: grid; }

    .reading-task {
      display: grid;
      grid-template-columns: 38px 15px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-height: 56px;
      padding: 8px 12px;
      border-bottom: 1px solid #ebe8df;
      scroll-margin-top: 74px;
    }

    .reading-task:last-child { border-bottom: 0; }
    .reading-task.done { opacity: .48; background: #f2f1ec; }
    .reading-task.done .reading-text { text-decoration: line-through; }
    .reading-task .check { width: 25px; height: 25px; }
    .reading-marker-spacer { width: 11px; height: 11px; }
    .reading-text { min-width: 0; line-height: 1.3; }

    .shopping-toolbar { display: grid; gap: 10px; margin-bottom: 14px; }

    .store-tabs, .mode-switch {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .store-tabs::-webkit-scrollbar, .mode-switch::-webkit-scrollbar { display: none; }

    .store-button, .mode-button {
      min-height: 42px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-weight: 650;
      white-space: nowrap;
    }

    .store-button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 14px;
      background: #e9e6dd;
    }

    .mode-button { border: 0; background: transparent; }
    .mode-button[aria-pressed="true"] { background: var(--paper); box-shadow: 0 2px 8px rgba(45, 52, 45, .1); }

    .shopping-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
    }

    .toggle-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 650;
    }

    .toggle-control input { width: 22px; height: 22px; accent-color: var(--accent); }

    .shopping-list { display: grid; gap: 0; }

    .shopping-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 58px;
      max-height: 80px;
      margin-bottom: 8px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      overflow: hidden;
      transition: opacity .2s ease, max-height .22s ease, min-height .22s ease,
        margin .22s ease, padding .22s ease, border-width .22s ease, transform .2s ease;
    }

    .shopping-item:last-child { margin-bottom: 0; }
    .shopping-item.done { opacity: .48; background: #f2f1ec; }
    .shopping-item.done .shopping-item-text { text-decoration: line-through; }
    .shopping-item.removing {
      min-height: 0;
      max-height: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-top-width: 0;
      border-bottom-width: 0;
      opacity: 0;
      transform: scale(.98);
    }
    .shopping-item-text { min-width: 0; line-height: 1.3; }

    .empty-state {
      margin: 0;
      padding: 22px 18px;
      border: 1px dashed #cbc9c0;
      border-radius: 14px;
      color: var(--muted);
      line-height: 1.45;
      text-align: center;
    }

    .finish-trip {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      border: 1px solid #a94a45;
      border-radius: 13px;
      background: #fff7f5;
      color: #873a36;
      font-weight: 750;
    }

    .data-groups { display: grid; gap: 16px; }

    .data-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
    }

    .data-group summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 54px;
      padding: 11px 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .data-group-content { padding: 12px 13px 13px; border-top: 1px solid var(--line); }

    .choice-list { display: grid; gap: 8px; }

    .choice-row {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      min-height: 42px;
    }

    .choice-row label { color: var(--muted); font-size: .78rem; text-align: right; }

    .choice-row input {
      width: 100%;
      height: 42px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #cfcdc4;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
      line-height: 1.25;
    }

    .today-data { border-left: 6px solid var(--today); }
    .week-data { border-left: 6px solid var(--week); }
    .month-data { border-left: 6px solid var(--month); }

    .shopping-data-heading { margin: 22px 2px 10px; font-size: 1.05rem; }

    .store-data-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 6px solid var(--shopping);
      border-radius: 16px;
      background: var(--paper);
    }

    .store-data-group summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 54px;
      padding: 11px 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .store-data-content { padding: 0 12px 13px; border-top: 1px solid var(--line); }

    .store-name-label {
      display: grid;
      gap: 6px;
      margin: 12px 0;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .store-name-label input {
      height: 44px;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid #cfcdc4;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
      font-weight: 500;
      letter-spacing: normal;
      text-transform: none;
    }

    :focus-visible { outline: 3px solid rgba(49, 95, 75, .38); outline-offset: 2px; }

    @media (min-width: 621px) {
      body { padding: 28px 0; }
      .app { min-height: calc(100vh - 56px); border-radius: 24px; overflow: clip; }
      main { padding-inline: 22px; }
      nav { padding-inline: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-row">
        <h1>Personal Dashboard</h1>
        <span id="saveStatus" aria-live="polite">Saved on this device</span>
      </div>
    </header>

    <nav aria-label="Dashboard sections">
      <button class="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" data-tab="week" aria-selected="false">This Week</button>
      <button class="tab" data-tab="month" aria-selected="false">This Month</button>
      <button class="tab" data-tab="shopping" aria-selected="false">Shopping</button>
      <button class="tab" data-tab="bible" aria-selected="false">Bible Reading</button>
      <button class="tab" data-tab="data" aria-selected="false">Data</button>
    </nav>

    <main id="main"></main>
  </div>

  <script src="bible-readings.js"></script>
  <script>
    const STORAGE_KEY = "personal-dashboard-v1";
    const sections = [
      { id: "today", title: "Today", className: "today", note: "5 items" },
      { id: "week", title: "This Week", className: "week", note: "Monday–Friday", days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"] },
      { id: "month", title: "This Month", className: "month", note: "5 items" }
    ];

    const blankChoices = () => Array(15).fill("");
    const blankStore = index => ({
      name: `Store ${index + 1}`,
      items: Array(100).fill(""),
      selected: {},
      purchased: {}
    });
    const defaults = {
      choices: {
        today: blankChoices(),
        week: blankChoices(),
        month: blankChoices()
      },
      tasks: {
        today: Array.from({ length: 5 }, (_, i) => ({ done: false, kind: i < 3 ? "select" : "text", value: "" })),
        week: Array.from({ length: 5 }, (_, i) => ({ done: false, kind: i < 3 ? "select" : "text", value: "" })),
        month: Array.from({ length: 5 }, (_, i) => ({ done: false, kind: i < 3 ? "select" : "text", value: "" }))
      },
      readingDone: {},
      shopping: {
        stores: Array.from({ length: 3 }, (_, index) => blankStore(index)),
        activeStore: 0,
        mode: "prepare",
        hidePurchased: false
      },
      comingUp: Array.from({ length: 3 }, () => ({ done: false, text: "", date: "" }))
    };

    const readingIds = new Set(BIBLE_READING_GROUPS.flatMap(group => group.readings.map(reading => reading.id)));
    const totalReadings = readingIds.size;

    function normalizedState(candidate) {
      const fresh = structuredClone(defaults);
      if (!candidate || typeof candidate !== "object") return fresh;
      for (const section of sections) {
        const id = section.id;
        if (Array.isArray(candidate.choices?.[id])) {
          fresh.choices[id] = candidate.choices[id].slice(0, 15).map(value => String(value ?? ""));
          while (fresh.choices[id].length < 15) fresh.choices[id].push("");
        }
        if (Array.isArray(candidate.tasks?.[id])) {
          fresh.tasks[id] = fresh.tasks[id].map((fallback, index) => {
            const task = candidate.tasks[id][index];
            return task ? { ...fallback, done: Boolean(task.done), value: String(task.value ?? "") } : fallback;
          });
        }
      }
      if (candidate.readingDone && typeof candidate.readingDone === "object") {
        for (const [id, done] of Object.entries(candidate.readingDone)) {
          if (done && readingIds.has(id)) fresh.readingDone[id] = true;
        }
      }
      if (candidate.shopping && typeof candidate.shopping === "object") {
        const candidateStores = Array.isArray(candidate.shopping.stores) ? candidate.shopping.stores : [];
        fresh.shopping.stores = fresh.shopping.stores.map((fallback, storeIndex) => {
          const candidateStore = candidateStores[storeIndex];
          if (!candidateStore || typeof candidateStore !== "object") return fallback;
          const store = blankStore(storeIndex);
          store.name = String(candidateStore.name ?? fallback.name).slice(0, 60);
          if (Array.isArray(candidateStore.items)) {
            store.items = candidateStore.items.slice(0, 100).map(value => String(value ?? "").slice(0, 160));
            while (store.items.length < 100) store.items.push("");
          }
          for (let index = 0; index < 100; index += 1) {
            if (!store.items[index]) continue;
            if (candidateStore.selected?.[index]) store.selected[index] = true;
            if (candidateStore.purchased?.[index] && store.selected[index]) store.purchased[index] = true;
          }
          return store;
        });
        const activeStore = Number(candidate.shopping.activeStore);
        if (Number.isInteger(activeStore) && activeStore >= 0 && activeStore < 3) fresh.shopping.activeStore = activeStore;
        if (candidate.shopping.mode === "shop") fresh.shopping.mode = "shop";
        fresh.shopping.hidePurchased = Boolean(candidate.shopping.hidePurchased);
      }
      if (Array.isArray(candidate.comingUp)) {
        fresh.comingUp = fresh.comingUp.map((fallback, index) => {
          const item = candidate.comingUp[index];
          if (!item || typeof item !== "object") return fallback;
          const date = /^\d{4}-\d{2}-\d{2}$/.test(String(item.date ?? "")) ? String(item.date) : "";
          return {
            done: Boolean(item.done),
            text: String(item.text ?? "").slice(0, 200),
            date
          };
        });
      }
      return fresh;
    }

    function loadState() {
      try { return normalizedState(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
      catch { return normalizedState(null); }
    }

    let state = loadState();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch { /* Continue with in-memory state if storage is temporarily unavailable. */ }
    let activeTab = "today";
    const main = document.getElementById("main");
    const saveStatus = document.getElementById("saveStatus");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      saveStatus.textContent = "Saved";
      clearTimeout(save.timer);
      save.timer = setTimeout(() => saveStatus.textContent = "Saved on this device", 900);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    function taskMarkup(section, task, index) {
      const id = section.id;
      const day = section.days?.[index];
      const field = task.kind === "select"
        ? `<select class="task-control" data-action="task-value" data-section="${id}" data-index="${index}" aria-label="${section.title} task ${index + 1}">
            <option value="">Choose a task…</option>
            ${selectOptions(state.choices[id], task.value)}
          </select>`
        : `<input class="task-control" data-action="task-value" data-section="${id}" data-index="${index}" type="text" value="${escapeHtml(task.value)}" placeholder="Enter a task…" aria-label="${section.title} task ${index + 1}">`;

      return `<div class="task${task.done ? " done" : ""}">
        <input class="check" data-action="task-done" data-section="${id}" data-index="${index}" type="checkbox" ${task.done ? "checked" : ""} aria-label="Mark ${section.title} task ${index + 1} complete">
        <div class="task-body">
          ${day ? `<span class="day-label">${day}</span>` : ""}
          ${field}
        </div>
      </div>`;
    }

    function selectOptions(choices, currentValue) {
      const values = choices.filter(Boolean);
      if (currentValue && !values.includes(currentValue)) values.unshift(currentValue);
      return values.map(value => `<option value="${escapeHtml(value)}" ${value === currentValue ? "selected" : ""}>${escapeHtml(value)}</option>`).join("");
    }

    function comingUpMarkup() {
      return `<div class="coming-up">
        <div class="coming-up-head"><h3>Coming Up</h3><span>3 dated reminders</span></div>
        <div class="coming-list">
          ${state.comingUp.map((item, index) => `<div class="coming-item${item.done ? " done" : ""}">
            <input class="check" data-action="coming-done" data-index="${index}" type="checkbox" ${item.done ? "checked" : ""} aria-label="Mark Coming Up item ${index + 1} complete">
            <div class="coming-fields">
              <input class="coming-text" data-action="coming-text" data-index="${index}" type="text" value="${escapeHtml(item.text)}" maxlength="200" placeholder="What’s coming up?" aria-label="Coming Up item ${index + 1}">
              <input class="coming-date" data-action="coming-date" data-index="${index}" type="date" value="${escapeHtml(item.date)}" aria-label="Due date for Coming Up item ${index + 1}">
            </div>
          </div>`).join("")}
        </div>
      </div>`;
    }

    function sectionMarkup(section) {
      return `<section class="panel ${section.className}${activeTab === section.id ? " active" : ""}" data-panel="${section.id}">
        <div class="section-head"><h2>${section.title}</h2><span>${section.note}</span></div>
        <div class="task-list">${state.tasks[section.id].map((task, index) => taskMarkup(section, task, index)).join("")}</div>
        ${section.id === "today" ? comingUpMarkup() : ""}
      </section>`;
    }

    function storeDisplayName(store, index) {
      return store.name.trim() || `Store ${index + 1}`;
    }

    function storeItems(store) {
      return store.items
        .map((text, index) => ({ text: text.trim(), index }))
        .filter(item => item.text)
        .sort((a, b) => a.text.localeCompare(b.text, undefined, { sensitivity: "base", numeric: true }));
    }

    function selectedStoreItems(store) {
      return storeItems(store).filter(item => store.selected[item.index]);
    }

    function shoppingMarkup() {
      const { stores, activeStore, mode, hidePurchased } = state.shopping;
      const store = stores[activeStore];
      const name = storeDisplayName(store, activeStore);
      const available = storeItems(store);
      const selected = selectedStoreItems(store);
      const purchasedCount = selected.reduce((count, item) => count + (store.purchased[item.index] ? 1 : 0), 0);
      const visibleTripItems = hidePurchased ? selected.filter(item => !store.purchased[item.index]) : selected;
      const progress = mode === "prepare" ? `${selected.length} selected` : `${purchasedCount} of ${selected.length}`;

      const prepareList = available.length
        ? `<div class="shopping-list">${available.map(item => `<label class="shopping-item">
            <input class="check" data-action="shopping-select" data-store="${activeStore}" data-index="${item.index}" type="checkbox" ${store.selected[item.index] ? "checked" : ""} aria-label="Add ${escapeHtml(item.text)} to the ${escapeHtml(name)} trip">
            <span class="shopping-item-text">${escapeHtml(item.text)}</span>
          </label>`).join("")}</div>`
        : `<p class="empty-state">No reusable items have been entered for ${escapeHtml(name)} yet. Add them in the Data tab.</p>`;

      const shopList = visibleTripItems.length
        ? `<div class="shopping-list">${visibleTripItems.map(item => `<label class="shopping-item${store.purchased[item.index] ? " done" : ""}">
            <input class="check" data-action="shopping-purchased" data-store="${activeStore}" data-index="${item.index}" type="checkbox" ${store.purchased[item.index] ? "checked" : ""} aria-label="Mark ${escapeHtml(item.text)} purchased">
            <span class="shopping-item-text">${escapeHtml(item.text)}</span>
          </label>`).join("")}</div>`
        : `<p class="empty-state">${selected.length ? "All selected items are purchased." : `No items are selected for ${escapeHtml(name)}. Use Prepare List to choose what you need.`}</p>`;

      return `<section class="panel shopping${activeTab === "shopping" ? " active" : ""}" data-panel="shopping">
        <div class="section-head"><h2>Shopping</h2><span id="shoppingProgress">${progress}</span></div>
        <div class="shopping-toolbar">
          <div class="store-tabs" aria-label="Stores">
            ${stores.map((item, index) => {
              const count = selectedStoreItems(item).length;
              return `<button class="store-button" data-action="shopping-store" data-store="${index}" aria-pressed="${index === activeStore}">${escapeHtml(storeDisplayName(item, index))}${count ? ` (${count})` : ""}</button>`;
            }).join("")}
          </div>
          <div class="mode-switch" aria-label="Shopping mode">
            <button class="mode-button" data-action="shopping-mode" data-mode="prepare" aria-pressed="${mode === "prepare"}">Prepare List</button>
            <button class="mode-button" data-action="shopping-mode" data-mode="shop" aria-pressed="${mode === "shop"}">Shop</button>
          </div>
        </div>
        ${mode === "prepare"
          ? `<p class="helper">Choose items from your reusable ${escapeHtml(name)} list. Only selected items appear in Shop mode.</p>${prepareList}`
          : `<p class="helper">Check off items as you purchase them. Your reusable master list will remain unchanged.</p>
            <div class="shopping-options">
              <label class="toggle-control"><input data-action="shopping-hide" type="checkbox" ${hidePurchased ? "checked" : ""}>Hide purchased</label>
            </div>
            ${shopList}
            ${selected.length ? `<button class="finish-trip" data-action="shopping-finish" data-store="${activeStore}">Finish ${escapeHtml(name)} Trip</button>` : ""}`}
      </section>`;
    }

    function completedReadingCount(readings) {
      return readings.reduce((count, reading) => count + (state.readingDone[reading.id] ? 1 : 0), 0);
    }

    function nextUnreadGroupIndex() {
      return BIBLE_READING_GROUPS.findIndex(group => group.readings.some(reading => !state.readingDone[reading.id]));
    }

    function markerMarkup(marker) {
      if (marker === "history") return `<span class="reading-marker history-marker" aria-label="Historical overview" title="Historical overview"></span>`;
      if (marker === "congregation") return `<span class="reading-marker congregation-marker" aria-label="Christian congregation overview" title="Christian congregation overview"></span>`;
      return `<span class="reading-marker-spacer" aria-hidden="true"></span>`;
    }

    function bibleMarkup() {
      const completed = completedReadingCount(BIBLE_READING_GROUPS.flatMap(group => group.readings));
      const openGroup = nextUnreadGroupIndex();
      return `<section class="panel bible${activeTab === "bible" ? " active" : ""}" data-panel="bible">
        <div class="section-head"><h2>Bible Reading</h2><span id="bibleProgress">${completed} of ${totalReadings}</span></div>
        <p class="helper">Check off each reading as you complete it. The group containing your next unread section opens automatically.</p>
        <div class="reading-legend">
          <span class="legend-item"><span class="reading-marker history-marker" aria-hidden="true"></span>Historical overview of God’s dealings with the Israelites</span>
          <span class="legend-item"><span class="reading-marker congregation-marker" aria-hidden="true"></span>Chronological overview of the Christian congregation</span>
        </div>
        <div class="reading-groups">
          ${BIBLE_READING_GROUPS.map((group, groupIndex) => {
            const groupCompleted = completedReadingCount(group.readings);
            return `<details class="reading-group" data-group="${groupIndex}"${groupIndex === openGroup ? " open" : ""}>
              <summary><span>${escapeHtml(group.title)}</span><span class="group-progress">${groupCompleted} of ${group.readings.length}</span></summary>
              <div class="reading-list">
                ${group.readings.map(reading => `<label class="reading-task${state.readingDone[reading.id] ? " done" : ""}">
                  <input class="check" data-action="reading-done" data-id="${reading.id}" type="checkbox" ${state.readingDone[reading.id] ? "checked" : ""} aria-label="Mark ${escapeHtml(reading.text)} complete">
                  ${markerMarkup(reading.marker)}
                  <span class="reading-text">${escapeHtml(reading.text)}</span>
                </label>`).join("")}
              </div>
            </details>`;
          }).join("")}
        </div>
      </section>`;
    }

    function scrollToNextReading() {
      const nextReading = document.querySelector('.reading-task input[type="checkbox"]:not(:checked)')?.closest(".reading-task");
      if (nextReading) nextReading.scrollIntoView({ behavior: "smooth", block: "start" });
      else window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function dataMarkup() {
      return `<section class="panel data${activeTab === "data" ? " active" : ""}" data-panel="data">
        <div class="section-head"><h2>Data</h2><span>Lists and stores</span></div>
        <p class="helper">Edit these lists to change the choices available in the first three task positions of each section.</p>
        <div class="data-groups">
          ${sections.map(section => {
            const choiceCount = state.choices[section.id].filter(value => value.trim()).length;
            return `<details class="data-group ${section.id}-data">
              <summary><span>${section.title}</span><span class="group-progress">${choiceCount} choices</span></summary>
              <div class="data-group-content">
                <div class="choice-list">
                  ${state.choices[section.id].map((value, index) => `<div class="choice-row">
                    <label for="choice-${section.id}-${index}">${index + 1}</label>
                    <input id="choice-${section.id}-${index}" data-action="choice" data-section="${section.id}" data-index="${index}" value="${escapeHtml(value)}" placeholder="Available choice">
                  </div>`).join("")}
                </div>
              </div>
            </details>`;
          }).join("")}
          <h3 class="shopping-data-heading">Shopping Stores</h3>
          <p class="helper">Rename each store and maintain up to 100 reusable items. Blank positions stay out of the Shopping tab.</p>
          ${state.shopping.stores.map((store, storeIndex) => {
            const itemCount = storeItems(store).length;
            return `<details class="store-data-group"${storeIndex === 0 ? " open" : ""}>
              <summary><span>${escapeHtml(storeDisplayName(store, storeIndex))}</span><span class="group-progress">${itemCount} items</span></summary>
              <div class="store-data-content">
                <label class="store-name-label">Store name
                  <input data-action="store-name" data-store="${storeIndex}" value="${escapeHtml(store.name)}" maxlength="60" placeholder="Store ${storeIndex + 1}">
                </label>
                <div class="choice-list">
                  ${store.items.map((value, itemIndex) => `<div class="choice-row">
                    <label for="store-${storeIndex}-item-${itemIndex}">${itemIndex + 1}</label>
                    <input id="store-${storeIndex}-item-${itemIndex}" data-action="shopping-item" data-store="${storeIndex}" data-index="${itemIndex}" value="${escapeHtml(value)}" maxlength="160" placeholder="Reusable shopping item">
                  </div>`).join("")}
                </div>
              </div>
            </details>`;
          }).join("")}
        </div>
      </section>`;
    }

    function render() {
      main.innerHTML = sections.map(sectionMarkup).join("") + shoppingMarkup() + bibleMarkup() + dataMarkup();
      document.querySelectorAll(".tab").forEach(button => {
        button.setAttribute("aria-selected", String(button.dataset.tab === activeTab));
      });
    }

    document.querySelector("nav").addEventListener("click", event => {
      const button = event.target.closest(".tab");
      if (!button) return;
      activeTab = button.dataset.tab;
      render();
      requestAnimationFrame(() => {
        if (activeTab === "bible") scrollToNextReading();
        else window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    main.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const { action, store, mode } = button.dataset;
      if (action === "shopping-store") {
        state.shopping.activeStore = Number(store);
        save();
        render();
      }
      if (action === "shopping-mode") {
        state.shopping.mode = mode;
        save();
        render();
      }
      if (action === "shopping-finish") {
        const storeIndex = Number(store);
        const currentStore = state.shopping.stores[storeIndex];
        const name = storeDisplayName(currentStore, storeIndex);
        if (!window.confirm(`Finish the ${name} trip and clear every selected item?`)) return;
        currentStore.selected = {};
        currentStore.purchased = {};
        state.shopping.hidePurchased = false;
        save();
        render();
      }
    });

    main.addEventListener("change", event => {
      const control = event.target;
      const { action, section, index, id, store } = control.dataset;
      if (!action) return;
      if (action === "coming-done") {
        state.comingUp[index].done = control.checked;
        save();
        control.closest(".coming-item").classList.toggle("done", control.checked);
        return;
      }
      if (action === "coming-date") {
        state.comingUp[index].date = control.value;
        save();
        return;
      }
      if (action === "shopping-select") {
        const currentStore = state.shopping.stores[Number(store)];
        if (control.checked) currentStore.selected[index] = true;
        else {
          delete currentStore.selected[index];
          delete currentStore.purchased[index];
        }
        save();
        render();
        return;
      }
      if (action === "shopping-purchased") {
        const currentStore = state.shopping.stores[Number(store)];
        if (control.checked) currentStore.purchased[index] = true;
        else delete currentStore.purchased[index];
        save();
        const row = control.closest(".shopping-item");
        row.classList.toggle("done", control.checked);
        const selected = selectedStoreItems(currentStore);
        const purchased = selected.reduce((count, item) => count + (currentStore.purchased[item.index] ? 1 : 0), 0);
        document.getElementById("shoppingProgress").textContent = `${purchased} of ${selected.length}`;
        if (state.shopping.hidePurchased && control.checked) {
          requestAnimationFrame(() => row.classList.add("removing"));
          setTimeout(() => {
            if (activeTab === "shopping") render();
          }, 230);
        }
        return;
      }
      if (action === "shopping-hide") {
        state.shopping.hidePurchased = control.checked;
        save();
        render();
        return;
      }
      if (action === "reading-done") {
        if (control.checked) state.readingDone[id] = true;
        else delete state.readingDone[id];
        save();

        const groupElement = control.closest(".reading-group");
        const group = BIBLE_READING_GROUPS[Number(groupElement.dataset.group)];
        const groupCompleted = completedReadingCount(group.readings);
        if (control.checked && groupCompleted === group.readings.length) {
          render();
          requestAnimationFrame(scrollToNextReading);
        } else {
          control.closest(".reading-task").classList.toggle("done", control.checked);
          groupElement.querySelector(".group-progress").textContent = `${groupCompleted} of ${group.readings.length}`;
          document.getElementById("bibleProgress").textContent = `${completedReadingCount(BIBLE_READING_GROUPS.flatMap(item => item.readings))} of ${totalReadings}`;
        }
        return;
      }
      if (action === "task-done") state.tasks[section][index].done = control.checked;
      if (action === "task-value") state.tasks[section][index].value = control.value;
      if (action === "choice") state.choices[section][index] = control.value.trim();
      save();
      if (action === "task-done") render();
    });

    main.addEventListener("input", event => {
      const control = event.target;
      const { action, section, index, store } = control.dataset;
      if (action === "task-value" && control.tagName === "INPUT") {
        state.tasks[section][index].value = control.value;
        save();
      }
      if (action === "choice") {
        state.choices[section][index] = control.value;
        save();
      }
      if (action === "store-name") {
        state.shopping.stores[Number(store)].name = control.value;
        save();
      }
      if (action === "shopping-item") {
        const currentStore = state.shopping.stores[Number(store)];
        currentStore.items[index] = control.value;
        if (!control.value.trim()) {
          delete currentStore.selected[index];
          delete currentStore.purchased[index];
        }
        save();
      }
      if (action === "coming-text") {
        state.comingUp[index].text = control.value;
        save();
      }
    });

    render();

    if ("serviceWorker" in navigator) {
      let updateInProgress = false;
      let reloadStarted = false;
      let hadController = Boolean(navigator.serviceWorker.controller);

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) {
          hadController = true;
          return;
        }
        if (reloadStarted) return;
        reloadStarted = true;
        window.location.reload();
      });

      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("./service-worker.js", {
            updateViaCache: "none"
          });

          const checkForUpdate = async () => {
            if (updateInProgress || !navigator.onLine) return;
            updateInProgress = true;
            try { await registration.update(); }
            catch { /* Stay on the current cached version if the check fails. */ }
            finally { updateInProgress = false; }
          };

          await checkForUpdate();

          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") checkForUpdate();
          });
          window.addEventListener("online", checkForUpdate);
        } catch {
          /* The dashboard still works normally if service-worker setup is unavailable. */
        }
      });
    }
  </script>
</body>
</html>
