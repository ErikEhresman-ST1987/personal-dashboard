<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="A calm, phone-friendly personal task dashboard.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Personal Dashboard</title>
  <script>
    try {
      const savedTheme = JSON.parse(localStorage.getItem("personal-dashboard-v1"))?.theme;
      if (["green", "blue", "orange", "dark"].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
    } catch { /* Use the default palette if saved appearance data is unavailable. */ }
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #252923;
      --muted: #697168;
      --paper: #fffefa;
      --canvas: #f3f0e8;
      --line: #dedbd1;
      --today: #d1e5f9;
      --month: #f9eacc;
      --shopping: #f5ddcf;
      --spiritual: #dcebe5;
      --data: #dfe5df;
      --accent: #315f4b;
      --strong: #252923;
      --on-strong: #fff;
      --on-accent: #fff;
      --control: #fff;
      --completed: #f2f1ec;
      --soft-line: #ebe8df;
      --control-border: #cbc9c0;
      --input-border: #cfcdc4;
      --button-border: #c5c1b7;
      --button-surface: #f8f6f0;
      --switch-surface: #e9e6dd;
      --accent-soft: #f3f8f5;
      --danger-border: #a94a45;
      --danger-surface: #fff7f5;
      --danger-ink: #873a36;
      --backup-border: #bbb8ae;
      --error: #9a3732;
      --section-meta: rgba(37, 41, 35, .66);
      --glow: rgba(255,255,255,.8);
      --app-surface: rgba(255, 254, 250, .92);
      --nav-surface: rgba(255, 254, 250, .96);
      --control-shadow: 0 2px 8px rgba(45, 52, 45, .1);
      --focus: rgba(49, 95, 75, .38);
      --done-opacity: .48;
      --shadow: 0 10px 30px rgba(45, 52, 45, .08);
    }

    html[data-theme="blue"] {
      --ink: #172c40; --muted: #566c7d; --paper: #fdfefe; --canvas: #edf3f8; --line: #cbd8e3;
      --today: #cfe2f3; --month: #ede4c7; --shopping: #eadbd4; --spiritual: #d9e8e4; --data: #dfe6eb;
      --accent: #356b9a; --strong: #172c40; --completed: #e8f0fa; --soft-line: #dce6ee;
      --control-border: #91a9bd; --input-border: #9fb4c5; --button-border: #9eb1c1;
      --button-surface: #eef4f9; --switch-surface: #dce6ef; --accent-soft: #edf5fb;
      --section-meta: rgba(23, 44, 64, .66); --shadow: 0 10px 30px rgba(32, 76, 112, .1);
      --control-shadow: 0 2px 8px rgba(32, 76, 112, .12); --focus: rgba(53, 107, 154, .42);
    }

    html[data-theme="orange"] {
      --ink: #3c291d; --muted: #776354; --paper: #fffdfa; --canvas: #faf6f1; --line: #e4d2c3;
      --today: #f1dfd0; --month: #f8e7bf; --shopping: #f4d6c7; --spiritual: #e8e2ce; --data: #eee0d6;
      --accent: #a85520; --strong: #3c291d; --completed: #f7eadc; --soft-line: #eddfd3;
      --control-border: #bfa48e; --input-border: #c9b19d; --button-border: #c7ad97;
      --button-surface: #fbf0e6; --switch-surface: #f0e2d5; --accent-soft: #fff2e7;
      --section-meta: rgba(60, 41, 29, .66); --shadow: 0 10px 30px rgba(112, 66, 32, .1);
      --control-shadow: 0 2px 8px rgba(112, 66, 32, .12); --focus: rgba(168, 85, 32, .4);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #edf5f0; --muted: #afc0b6; --paper: #18231e; --canvas: #101713; --line: #3a5144;
      --today: #24394a; --month: #413923; --shopping: #442e27; --spiritual: #23382f; --data: #2b3630;
      --accent: #6fc18f; --strong: #6fc18f; --on-strong: #102117; --on-accent: #102117;
      --control: #1d2a24; --completed: #223229; --soft-line: #31443a; --control-border: #668071;
      --input-border: #52695c; --button-border: #566f61; --button-surface: #202e27;
      --switch-surface: #26372e; --accent-soft: #20362a; --danger-border: #704545;
      --danger-surface: #2d1d1d; --danger-ink: #ffaaaa; --backup-border: #668071; --error: #ffaaaa;
      --section-meta: rgba(237, 245, 240, .7); --glow: rgba(111, 193, 143, .08);
      --app-surface: rgba(24, 35, 30, .96); --nav-surface: rgba(24, 35, 30, .98);
      --shadow: 0 10px 30px rgba(0, 0, 0, .28); --control-shadow: 0 2px 8px rgba(0, 0, 0, .3);
      --focus: rgba(131, 191, 255, .5); --done-opacity: .68;
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at top right, var(--glow), transparent 38%),
        var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }

    button, select, input[type="checkbox"] { touch-action: manipulation; }

    .app {
      width: min(100%, 620px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--app-surface);
      box-shadow: var(--shadow);
    }

    header {
      padding: max(18px, env(safe-area-inset-top)) 18px 13px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.55rem, 7vw, 2.05rem);
      font-weight: 700;
      letter-spacing: -.025em;
    }

    #saveStatus {
      flex: 0 0 8.5rem;
      color: var(--muted);
      font-size: .78rem;
      text-align: right;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 11px 14px;
      background: var(--nav-surface);
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    nav::-webkit-scrollbar { display: none; }

    .tab {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--control);
      color: var(--ink);
      font-weight: 650;
      white-space: nowrap;
    }

    .tab[aria-selected="true"] {
      background: var(--strong);
      border-color: var(--strong);
      color: var(--on-strong);
    }

    main { padding: 16px 14px calc(28px + env(safe-area-inset-bottom)); }

    .panel { display: none; }
    .panel.active { display: block; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 16px 17px;
      border-radius: 18px;
    }

    .section-head h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      letter-spacing: -.015em;
    }

    .section-head span {
      color: var(--section-meta);
      font-size: .8rem;
      font-weight: 650;
    }

    .today .section-head { background: var(--today); }
    .month .section-head { background: var(--month); }
    .shopping .section-head { background: var(--shopping); }
    .spiritual .section-head { background: var(--spiritual); }
    .data .section-head { background: var(--data); }

    .today-options { margin: -3px 2px 10px; }
    .task-list { display: grid; gap: 10px; }

    .task {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 66px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      max-height: 200px;
      transition: opacity .18s ease, background .18s ease, max-height .23s ease,
        min-height .23s ease, padding .23s ease, border-width .23s ease;
    }

    .task.done { opacity: var(--done-opacity); background: var(--completed); }
    .task.done .task-control { text-decoration: line-through; }
    .task.removing {
      min-height: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-top-width: 0;
      border-bottom-width: 0;
      opacity: 0;
      overflow: hidden;
    }

    .coming-up {
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .coming-up-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 48px;
      margin: 0 2px;
      cursor: pointer;
      list-style-position: inside;
    }

    .coming-up[open] .coming-up-head { margin-bottom: 10px; }

    .coming-up-head h3 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.18rem;
    }

    .coming-up-head span { color: var(--muted); font-size: .78rem; }

    .coming-list { display: grid; gap: 10px; }

    .coming-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 104px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      transition: opacity .18s ease, background .18s ease;
    }

    .coming-item.done { opacity: var(--done-opacity); background: var(--completed); }
    .coming-item.done .coming-text { text-decoration: line-through; }

    .coming-fields { display: grid; gap: 7px; min-width: 0; }

    .coming-text, .coming-date {
      width: 100%;
      height: 42px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
    }

    .coming-date { color: var(--muted); }

    .daily-items {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .daily-text {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      font-weight: 700;
      transition: opacity .18s ease, background .18s ease;
    }

    .daily-text.done { opacity: var(--done-opacity); background: var(--completed); }
    .daily-text.done span { text-decoration: line-through; }

    .spiritual-groups { display: grid; gap: 10px; }

    .spiritual-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
    }

    .spiritual-group summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside;
    }

    .spiritual-group[open] summary {
      background: color-mix(in srgb, var(--spiritual) 62%, var(--control));
      border-bottom: 1px solid var(--line);
    }

    .spiritual-content { padding: 10px 12px 12px; }
    .spiritual-list { display: grid; gap: 8px; }

    .spiritual-check-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      min-height: 56px;
      padding: 8px 10px;
      border: 1px solid var(--soft-line);
      border-radius: 13px;
      background: var(--control);
      transition: opacity .18s ease, background .18s ease;
    }

    .spiritual-check-row.done { opacity: var(--done-opacity); background: var(--completed); }
    .spiritual-check-row.done span { text-decoration: line-through; }

    .sunday-count {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 78px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 650;
    }

    .sunday-count select {
      width: 100%;
      height: 42px;
      padding: 7px 9px;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
    }

    .spiritual-manual-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 104px;
      padding: 10px;
      border: 1px solid var(--soft-line);
      border-radius: 14px;
      background: var(--control);
      transition: opacity .18s ease, background .18s ease;
    }

    .spiritual-manual-row.done { opacity: var(--done-opacity); background: var(--completed); }
    .spiritual-manual-row.done .spiritual-text { text-decoration: line-through; }
    .spiritual-fields { display: grid; gap: 7px; min-width: 0; }

    .spiritual-text, .spiritual-date {
      width: 100%;
      height: 42px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
    }

    .spiritual-date { color: var(--muted); }

    .spiritual-clear {
      width: 100%;
      min-height: 44px;
      margin-top: 11px;
      border: 1px solid var(--button-border);
      border-radius: 11px;
      background: var(--button-surface);
      color: var(--ink);
      font-weight: 700;
    }

    .check {
      width: 27px;
      height: 27px;
      margin: 0;
      accent-color: var(--accent);
    }

    .task-body { min-width: 0; }

    .day-label {
      display: block;
      margin: 0 0 5px 2px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .task-control {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid var(--control-border);
      border-radius: 11px;
      background: var(--control);
      color: var(--ink);
      font-size: 1rem;
    }

    select.task-control { padding-right: 34px; }

    .helper {
      margin: -4px 3px 16px;
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.4;
    }

    .group-progress {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .shopping-toolbar { display: grid; gap: 10px; margin-bottom: 14px; }

    .store-tabs, .mode-switch {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .store-tabs::-webkit-scrollbar, .mode-switch::-webkit-scrollbar { display: none; }

    .store-button, .mode-button {
      min-height: 42px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--control);
      color: var(--ink);
      font-weight: 650;
      white-space: nowrap;
    }

    .store-button[aria-pressed="true"] {
      background: var(--strong);
      border-color: var(--strong);
      color: var(--on-strong);
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 14px;
      background: var(--switch-surface);
    }

    .mode-button { border: 0; background: transparent; }
    .mode-button[aria-pressed="true"] { background: var(--paper); box-shadow: var(--control-shadow); }

    .shopping-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
    }

    .toggle-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 650;
    }

    .toggle-control input { width: 22px; height: 22px; accent-color: var(--accent); }

    .shopping-list { display: grid; gap: 0; }

    .shopping-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 58px;
      max-height: 80px;
      margin-bottom: 8px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      overflow: hidden;
      transition: opacity .2s ease, max-height .22s ease, min-height .22s ease,
        margin .22s ease, padding .22s ease, border-width .22s ease, transform .2s ease;
    }

    .shopping-item:last-child { margin-bottom: 0; }
    .shopping-item.done { opacity: var(--done-opacity); background: var(--completed); }
    .shopping-item.done .shopping-item-text { text-decoration: line-through; }
    .shopping-item.removing {
      min-height: 0;
      max-height: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-top-width: 0;
      border-bottom-width: 0;
      opacity: 0;
      transform: scale(.98);
    }
    .shopping-item-text { min-width: 0; line-height: 1.3; }

    .empty-state {
      margin: 0;
      padding: 22px 18px;
      border: 1px dashed var(--control-border);
      border-radius: 14px;
      color: var(--muted);
      line-height: 1.45;
      text-align: center;
    }

    .finish-trip {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      border: 1px solid var(--danger-border);
      border-radius: 13px;
      background: var(--danger-surface);
      color: var(--danger-ink);
      font-weight: 750;
    }

    .data-groups { display: grid; gap: 16px; }

    .data-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
    }

    .data-group summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 54px;
      padding: 11px 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .data-group-content { padding: 12px 13px 13px; border-top: 1px solid var(--line); }

    .backup-data { border-left: 6px solid var(--data); }

    .backup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .backup-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 9px 11px;
      border: 1px solid var(--backup-border);
      border-radius: 12px;
      background: var(--control);
      color: var(--ink);
      font-weight: 700;
      text-align: center;
    }

    .backup-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--on-accent);
    }

    .backup-file {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .backup-status {
      min-height: 1.25em;
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
    }

    .backup-status.error { color: var(--error); }

    .visibility-data { border-left: 6px solid var(--accent); }
    .visibility-list { display: grid; gap: 7px; }

    .visibility-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      min-height: 48px;
      padding: 7px 9px;
      border: 1px solid var(--soft-line);
      border-radius: 12px;
      background: var(--control);
      font-weight: 650;
    }

    .visibility-row input {
      width: 24px;
      height: 24px;
      margin: 0;
      accent-color: var(--accent);
    }

    .choice-list { display: grid; gap: 8px; }

    .choice-row {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      min-height: 42px;
    }

    .choice-row label { color: var(--muted); font-size: .78rem; text-align: right; }

    .choice-row input {
      width: 100%;
      height: 42px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
    }

    .today-data { border-left: 6px solid var(--today); }
    .month-data { border-left: 6px solid var(--month); }

    .shopping-data-heading { margin: 22px 2px 10px; font-size: 1.05rem; }

    .store-data-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 6px solid var(--shopping);
      border-radius: 16px;
      background: var(--paper);
    }

    .store-data-group summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 54px;
      padding: 11px 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .store-data-content { padding: 0 12px 13px; border-top: 1px solid var(--line); }

    .alphabetize-store {
      width: 100%;
      min-height: 44px;
      margin: 0 0 12px;
      border: 1px solid var(--accent);
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 750;
    }

    .store-name-label {
      display: grid;
      gap: 6px;
      margin: 12px 0;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .store-name-label input {
      height: 44px;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: var(--control);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.25;
      font-weight: 500;
      letter-spacing: normal;
      text-transform: none;
    }

    .appearance-data { border-left: 6px solid var(--accent); }

    .theme-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }

    .theme-option {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 18px;
      gap: 8px;
      align-items: center;
      min-height: 50px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--control);
      color: var(--ink);
      font-weight: 700;
      text-align: left;
    }

    .theme-option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .theme-swatch { width: 25px; height: 25px; border: 2px solid var(--control-border); border-radius: 50%; }
    .swatch-green { background: #315f4b; }
    .swatch-blue { background: #356b9a; }
    .swatch-orange { background: #a85520; }
    .swatch-dark { background: #18231e; }
    .theme-selected { color: var(--accent); visibility: hidden; }
    .theme-option[aria-pressed="true"] .theme-selected { visibility: visible; }

    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    @media (min-width: 621px) {
      body { padding: 28px 0; }
      .app { min-height: calc(100vh - 56px); border-radius: 24px; overflow: clip; }
      main { padding-inline: 22px; }
      nav { padding-inline: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-row">
        <h1>Personal Dashboard</h1>
        <span id="saveStatus" aria-live="polite">Saved on this device</span>
      </div>
    </header>

    <nav aria-label="Dashboard sections">
      <button class="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" data-tab="month" aria-selected="false">This Month</button>
      <button class="tab" data-tab="shopping" aria-selected="false">Shopping</button>
      <button class="tab" data-tab="spiritual" aria-selected="false">Spiritual</button>
      <button class="tab" data-tab="data" aria-selected="false">Data</button>
    </nav>

    <main id="main"></main>
  </div>

  <script>
    const STORAGE_KEY = "personal-dashboard-v1";
    const BACKUP_APP_ID = "personal-dashboard";
    const BACKUP_FORMAT_VERSION = 1;
    const VALID_THEMES = ["green", "blue", "orange", "dark"];
    const THEME_LABELS = { green: "Green", blue: "Blue", orange: "Orange", dark: "Dark" };
    const THEME_COLORS = { green: "#f6f3ec", blue: "#356b9a", orange: "#984b1b", dark: "#101713" };
    const sections = [
      { id: "today", title: "Today", className: "today", note: "10 items" },
      { id: "month", title: "This Month", className: "month", note: "5 items" }
    ];
    const configurableTabs = [
      { id: "today", label: "Today" },
      { id: "month", label: "This Month" },
      { id: "shopping", label: "Shopping" },
      { id: "spiritual", label: "Spiritual" }
    ];

    const blankChoices = () => Array(15).fill("");
    const blankStore = index => ({
      name: `Store ${index + 1}`,
      items: Array(100).fill(""),
      selected: {},
      purchased: {}
    });
    const blankDatedEntries = () => Array.from({ length: 2 }, () => ({ done: false, text: "", date: "" }));
    const defaults = {
      theme: "green",
      hideCompletedToday: true,
      choices: {
        today: blankChoices(),
        month: blankChoices()
      },
      tasks: {
        today: Array.from({ length: 10 }, (_, i) => ({ done: false, kind: i < 3 ? "select" : "text", value: "" })),
        month: Array.from({ length: 5 }, (_, i) => ({ done: false, kind: i < 3 ? "select" : "text", value: "" }))
      },
      shopping: {
        stores: Array.from({ length: 3 }, (_, index) => blankStore(index)),
        activeStore: 0,
        mode: "prepare",
        hidePurchased: false
      },
      comingUp: Array.from({ length: 5 }, () => ({ done: false, text: "", date: "" })),
      comingUpOpen: true,
      spiritual: {
        dailyTextDate: "",
        dailyBibleReadingDate: "",
        midweekDone: Array(4).fill(false),
        sundaySubheadingCount: 3,
        sundayDone: Array(5).fill(false),
        sundayReviewDone: false,
        upcomingParts: blankDatedEntries(),
        customActivities: blankDatedEntries(),
        openGroups: { midweek: true, sunday: false, upcoming: false, custom: false }
      },
      visibleTabs: Object.fromEntries(configurableTabs.map(tab => [tab.id, true]))
    };

    function normalizedState(candidate) {
      const fresh = structuredClone(defaults);
      if (!candidate || typeof candidate !== "object") return fresh;
      if (VALID_THEMES.includes(candidate.theme)) fresh.theme = candidate.theme;
      if (typeof candidate.hideCompletedToday === "boolean") fresh.hideCompletedToday = candidate.hideCompletedToday;
      for (const section of sections) {
        const id = section.id;
        if (Array.isArray(candidate.choices?.[id])) {
          fresh.choices[id] = candidate.choices[id].slice(0, 15).map(value => String(value ?? ""));
          while (fresh.choices[id].length < 15) fresh.choices[id].push("");
        }
        if (Array.isArray(candidate.tasks?.[id])) {
          fresh.tasks[id] = fresh.tasks[id].map((fallback, index) => {
            const task = candidate.tasks[id][index];
            return task ? { ...fallback, done: Boolean(task.done), value: String(task.value ?? "") } : fallback;
          });
        }
      }
      if (candidate.shopping && typeof candidate.shopping === "object") {
        const candidateStores = Array.isArray(candidate.shopping.stores) ? candidate.shopping.stores : [];
        fresh.shopping.stores = fresh.shopping.stores.map((fallback, storeIndex) => {
          const candidateStore = candidateStores[storeIndex];
          if (!candidateStore || typeof candidateStore !== "object") return fallback;
          const store = blankStore(storeIndex);
          store.name = String(candidateStore.name ?? fallback.name).slice(0, 60);
          if (Array.isArray(candidateStore.items)) {
            store.items = candidateStore.items.slice(0, 100).map(value => String(value ?? "").slice(0, 160));
            while (store.items.length < 100) store.items.push("");
          }
          for (let index = 0; index < 100; index += 1) {
            if (!store.items[index]) continue;
            if (candidateStore.selected?.[index]) store.selected[index] = true;
            if (candidateStore.purchased?.[index] && store.selected[index]) store.purchased[index] = true;
          }
          return store;
        });
        const activeStore = Number(candidate.shopping.activeStore);
        if (Number.isInteger(activeStore) && activeStore >= 0 && activeStore < 3) fresh.shopping.activeStore = activeStore;
        if (candidate.shopping.mode === "shop") fresh.shopping.mode = "shop";
        fresh.shopping.hidePurchased = Boolean(candidate.shopping.hidePurchased);
      }
      if (Array.isArray(candidate.comingUp)) {
        fresh.comingUp = fresh.comingUp.map((fallback, index) => {
          const item = candidate.comingUp[index];
          if (!item || typeof item !== "object") return fallback;
          const date = /^\d{4}-\d{2}-\d{2}$/.test(String(item.date ?? "")) ? String(item.date) : "";
          return {
            done: Boolean(item.done),
            text: String(item.text ?? "").slice(0, 200),
            date
          };
        });
      }
      if (typeof candidate.comingUpOpen === "boolean") fresh.comingUpOpen = candidate.comingUpOpen;
      if (candidate.spiritual && typeof candidate.spiritual === "object") {
        const spiritual = candidate.spiritual;
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(spiritual.dailyTextDate ?? ""))) {
          fresh.spiritual.dailyTextDate = String(spiritual.dailyTextDate);
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(spiritual.dailyBibleReadingDate ?? ""))) {
          fresh.spiritual.dailyBibleReadingDate = String(spiritual.dailyBibleReadingDate);
        }
        if (Array.isArray(spiritual.midweekDone)) {
          fresh.spiritual.midweekDone = fresh.spiritual.midweekDone.map((_, index) => Boolean(spiritual.midweekDone[index]));
        }
        const subheadingCount = Number(spiritual.sundaySubheadingCount);
        if (Number.isInteger(subheadingCount) && subheadingCount >= 1 && subheadingCount <= 5) {
          fresh.spiritual.sundaySubheadingCount = subheadingCount;
        }
        if (Array.isArray(spiritual.sundayDone)) {
          fresh.spiritual.sundayDone = fresh.spiritual.sundayDone.map((_, index) =>
            index < fresh.spiritual.sundaySubheadingCount && Boolean(spiritual.sundayDone[index])
          );
        }
        fresh.spiritual.sundayReviewDone = Boolean(spiritual.sundayReviewDone);
        for (const key of ["upcomingParts", "customActivities"]) {
          if (!Array.isArray(spiritual[key])) continue;
          fresh.spiritual[key] = fresh.spiritual[key].map((fallback, index) => {
            const item = spiritual[key][index];
            if (!item || typeof item !== "object") return fallback;
            const date = /^\d{4}-\d{2}-\d{2}$/.test(String(item.date ?? "")) ? String(item.date) : "";
            return { done: Boolean(item.done), text: String(item.text ?? "").slice(0, 200), date };
          });
        }
        if (spiritual.openGroups && typeof spiritual.openGroups === "object") {
          for (const key of Object.keys(fresh.spiritual.openGroups)) {
            fresh.spiritual.openGroups[key] = Boolean(spiritual.openGroups[key]);
          }
        }
      }
      if (candidate.visibleTabs && typeof candidate.visibleTabs === "object") {
        for (const tab of configurableTabs) {
          if (typeof candidate.visibleTabs[tab.id] === "boolean") {
            fresh.visibleTabs[tab.id] = candidate.visibleTabs[tab.id];
          }
        }
      }
      return fresh;
    }

    function loadState() {
      try { return normalizedState(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
      catch { return normalizedState(null); }
    }

    let state = loadState();
    applyTheme(state.theme);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch { /* Continue with in-memory state if storage is temporarily unavailable. */ }
    let activeTab = "today";
    const main = document.getElementById("main");
    const saveStatus = document.getElementById("saveStatus");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      saveStatus.textContent = "Saved";
      clearTimeout(save.timer);
      save.timer = setTimeout(() => saveStatus.textContent = "Saved on this device", 900);
    }

    function applyTheme(theme) {
      const safeTheme = VALID_THEMES.includes(theme) ? theme : "green";
      document.documentElement.dataset.theme = safeTheme;
      document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[safeTheme];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    function localDateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function setBackupStatus(message, isError = false) {
      const status = document.getElementById("backupStatus");
      if (!status) return;
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function backupFileName() {
      return `personal-dashboard-backup-${localDateKey()}.json`;
    }

    function backupContents() {
      return JSON.stringify({
        app: BACKUP_APP_ID,
        formatVersion: BACKUP_FORMAT_VERSION,
        exportedAt: new Date().toISOString(),
        data: state
      }, null, 2);
    }

    function isValidBackup(payload) {
      if (!payload || typeof payload !== "object") return false;
      if (payload.app !== BACKUP_APP_ID || payload.formatVersion !== BACKUP_FORMAT_VERSION) return false;
      if (!payload.data || typeof payload.data !== "object") return false;
      return ["choices", "tasks", "shopping", "comingUp", "spiritual"]
        .every(key => Object.prototype.hasOwnProperty.call(payload.data, key));
    }

    function downloadBackup(contents, fileName) {
      const url = URL.createObjectURL(new Blob([contents], { type: "application/json" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function exportBackup() {
      const contents = backupContents();
      const fileName = backupFileName();
      try {
        if (typeof File !== "undefined" && navigator.share && navigator.canShare) {
          const file = new File([contents], fileName, { type: "application/json" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "Personal Dashboard Backup" });
            setBackupStatus("Backup share completed. Keep the JSON file somewhere safe.");
            return;
          }
        }
        downloadBackup(contents, fileName);
        setBackupStatus(`Saved ${fileName}.`);
      } catch (error) {
        if (error?.name === "AbortError") {
          setBackupStatus("Backup canceled.");
          return;
        }
        setBackupStatus("The backup could not be saved. Your dashboard data is unchanged.", true);
      }
    }

    function readBackupFile(file) {
      if (typeof file.text === "function") return file.text();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener("load", () => resolve(String(reader.result ?? "")));
        reader.addEventListener("error", () => reject(reader.error));
        reader.readAsText(file);
      });
    }

    async function restoreBackup(file) {
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        setBackupStatus("That file is too large to be a Personal Dashboard backup.", true);
        return;
      }
      try {
        const payload = JSON.parse(await readBackupFile(file));
        if (!isValidBackup(payload)) {
          setBackupStatus("That is not a valid Personal Dashboard backup file.", true);
          return;
        }
        const exportedDate = /^\d{4}-\d{2}-\d{2}/.test(String(payload.exportedAt ?? ""))
          ? String(payload.exportedAt).slice(0, 10)
          : "an unknown date";
        if (!window.confirm(`Restore the backup from ${exportedDate}? This will replace all current dashboard data.`)) {
          setBackupStatus("Restore canceled. Your dashboard data is unchanged.");
          return;
        }
        state = normalizedState(payload.data);
        applyTheme(state.theme);
        save();
        activeTab = "data";
        render();
        const backupGroup = main.querySelector(".backup-data");
        if (backupGroup) backupGroup.open = true;
        setBackupStatus("Backup restored successfully.");
      } catch {
        setBackupStatus("The selected file could not be read as a dashboard backup.", true);
      }
    }

    function taskMarkup(section, task, index) {
      const id = section.id;
      const day = section.days?.[index];
      const field = task.kind === "select"
        ? `<select class="task-control" data-action="task-value" data-section="${id}" data-index="${index}" aria-label="${section.title} task ${index + 1}">
            <option value="">Choose a task…</option>
            ${selectOptions(state.choices[id], task.value)}
          </select>`
        : `<input class="task-control" data-action="task-value" data-section="${id}" data-index="${index}" type="text" value="${escapeHtml(task.value)}" placeholder="Enter a task…" aria-label="${section.title} task ${index + 1}">`;

      return `<div class="task${task.done ? " done" : ""}">
        <input class="check" data-action="task-done" data-section="${id}" data-index="${index}" type="checkbox" ${task.done ? "checked" : ""} aria-label="Mark ${section.title} task ${index + 1} complete">
        <div class="task-body">
          ${day ? `<span class="day-label">${day}</span>` : ""}
          ${field}
        </div>
      </div>`;
    }

    function selectOptions(choices, currentValue) {
      const values = choices.filter(Boolean);
      if (currentValue && !values.includes(currentValue)) values.unshift(currentValue);
      return values.map(value => `<option value="${escapeHtml(value)}" ${value === currentValue ? "selected" : ""}>${escapeHtml(value)}</option>`).join("");
    }

    function shortDateLabel(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" })
        .format(new Date(year, month - 1, day));
    }

    function comingUpSummary() {
      const activeItems = state.comingUp.filter(item => !item.done && (item.text.trim() || item.date));
      if (!activeItems.length) return "No active items";
      const nextDate = activeItems.map(item => item.date).filter(Boolean).sort()[0];
      if (!nextDate) return `${activeItems.length} active`;
      const dateLabel = shortDateLabel(nextDate);
      if (nextDate < localDateKey()) return `${activeItems.length} active · ${dateLabel} overdue`;
      if (nextDate === localDateKey()) return `${activeItems.length} active · Due today`;
      return `${activeItems.length} active · Next ${dateLabel}`;
    }

    function updateComingUpSummary() {
      const summary = document.getElementById("comingUpSummary");
      if (summary) summary.textContent = comingUpSummary();
    }

    function comingUpMarkup() {
      return `<details class="coming-up" data-coming-up${state.comingUpOpen ? " open" : ""}>
        <summary class="coming-up-head"><h3>Coming Up</h3><span id="comingUpSummary">${escapeHtml(comingUpSummary())}</span></summary>
        <div class="coming-list">
          ${state.comingUp.map((item, index) => `<div class="coming-item${item.done ? " done" : ""}">
            <input class="check" data-action="coming-done" data-index="${index}" type="checkbox" ${item.done ? "checked" : ""} aria-label="Mark Coming Up item ${index + 1} complete">
            <div class="coming-fields">
              <input class="coming-text" data-action="coming-text" data-index="${index}" type="text" value="${escapeHtml(item.text)}" maxlength="200" placeholder="What’s coming up?" aria-label="Coming Up item ${index + 1}">
              <input class="coming-date" data-action="coming-date" data-index="${index}" type="date" value="${escapeHtml(item.date)}" aria-label="Due date for Coming Up item ${index + 1}">
            </div>
          </div>`).join("")}
        </div>
      </details>`;
    }

    function sectionMarkup(section) {
      const tasks = state.tasks[section.id];
      const visibleTasks = tasks.map((task, index) => ({ task, index }))
        .filter(({ task }) => section.id !== "today" || !state.hideCompletedToday || !task.done);
      return `<section class="panel ${section.className}${activeTab === section.id ? " active" : ""}" data-panel="${section.id}">
        <div class="section-head"><h2>${section.title}</h2><span>${section.note}</span></div>
        ${section.id === "today" ? `<div class="today-options">
          <label class="toggle-control"><input data-action="today-hide-completed" type="checkbox" ${state.hideCompletedToday ? "checked" : ""}>Hide completed</label>
        </div>` : ""}
        <div class="task-list">${visibleTasks.map(({ task, index }) => taskMarkup(section, task, index)).join("")
          || (section.id === "today" ? `<p class="empty-state">All Today tasks are complete. Turn off Hide completed to review them.</p>` : "")}</div>
        ${section.id === "today" ? comingUpMarkup() : ""}
      </section>`;
    }

    function storeDisplayName(store, index) {
      return store.name.trim() || `Store ${index + 1}`;
    }

    function storeItems(store) {
      return store.items
        .map((text, index) => ({ text: text.trim(), index }))
        .filter(item => item.text)
        .sort((a, b) => a.text.localeCompare(b.text, undefined, { sensitivity: "base", numeric: true }));
    }

    function alphabetizeStoreData(store) {
      const filled = store.items
        .map((text, index) => ({
          text,
          selected: Boolean(store.selected[index]),
          purchased: Boolean(store.purchased[index])
        }))
        .filter(item => item.text.trim())
        .sort((a, b) => a.text.trim().localeCompare(b.text.trim(), undefined, { sensitivity: "base", numeric: true }));

      store.items = filled.map(item => item.text);
      while (store.items.length < 100) store.items.push("");
      store.selected = {};
      store.purchased = {};
      filled.forEach((item, index) => {
        if (item.selected) store.selected[index] = true;
        if (item.purchased && item.selected) store.purchased[index] = true;
      });
    }

    function selectedStoreItems(store) {
      return storeItems(store).filter(item => store.selected[item.index]);
    }

    function shoppingMarkup() {
      const { stores, activeStore, mode, hidePurchased } = state.shopping;
      const store = stores[activeStore];
      const name = storeDisplayName(store, activeStore);
      const available = storeItems(store);
      const selected = selectedStoreItems(store);
      const purchasedCount = selected.reduce((count, item) => count + (store.purchased[item.index] ? 1 : 0), 0);
      const visibleTripItems = hidePurchased ? selected.filter(item => !store.purchased[item.index]) : selected;
      const progress = mode === "prepare" ? `${selected.length} selected` : `${purchasedCount} of ${selected.length}`;

      const prepareList = available.length
        ? `<div class="shopping-list">${available.map(item => `<label class="shopping-item">
            <input class="check" data-action="shopping-select" data-store="${activeStore}" data-index="${item.index}" type="checkbox" ${store.selected[item.index] ? "checked" : ""} aria-label="Add ${escapeHtml(item.text)} to the ${escapeHtml(name)} trip">
            <span class="shopping-item-text">${escapeHtml(item.text)}</span>
          </label>`).join("")}</div>`
        : `<p class="empty-state">No reusable items have been entered for ${escapeHtml(name)} yet. Add them in the Data tab.</p>`;

      const shopList = visibleTripItems.length
        ? `<div class="shopping-list">${visibleTripItems.map(item => `<label class="shopping-item${store.purchased[item.index] ? " done" : ""}">
            <input class="check" data-action="shopping-purchased" data-store="${activeStore}" data-index="${item.index}" type="checkbox" ${store.purchased[item.index] ? "checked" : ""} aria-label="Mark ${escapeHtml(item.text)} purchased">
            <span class="shopping-item-text">${escapeHtml(item.text)}</span>
          </label>`).join("")}</div>`
        : `<p class="empty-state">${selected.length ? "All selected items are purchased." : `No items are selected for ${escapeHtml(name)}. Use Prepare List to choose what you need.`}</p>`;

      return `<section class="panel shopping${activeTab === "shopping" ? " active" : ""}" data-panel="shopping">
        <div class="section-head"><h2>Shopping</h2><span id="shoppingProgress">${progress}</span></div>
        <div class="shopping-toolbar">
          <div class="store-tabs" aria-label="Stores">
            ${stores.map((item, index) => {
              const count = selectedStoreItems(item).length;
              return `<button class="store-button" data-action="shopping-store" data-store="${index}" aria-pressed="${index === activeStore}">${escapeHtml(storeDisplayName(item, index))}${count ? ` (${count})` : ""}</button>`;
            }).join("")}
          </div>
          <div class="mode-switch" aria-label="Shopping mode">
            <button class="mode-button" data-action="shopping-mode" data-mode="prepare" aria-pressed="${mode === "prepare"}">Prepare List</button>
            <button class="mode-button" data-action="shopping-mode" data-mode="shop" aria-pressed="${mode === "shop"}">Shop</button>
          </div>
        </div>
        ${mode === "prepare"
          ? `<p class="helper">Choose items from your reusable ${escapeHtml(name)} list. Only selected items appear in Shop mode.</p>${prepareList}`
          : `<p class="helper">Check off items as you purchase them. Your reusable master list will remain unchanged.</p>
            <div class="shopping-options">
              <label class="toggle-control"><input data-action="shopping-hide" type="checkbox" ${hidePurchased ? "checked" : ""}>Hide purchased</label>
            </div>
            ${shopList}
            ${selected.length ? `<button class="finish-trip" data-action="shopping-finish" data-store="${activeStore}">Finish ${escapeHtml(name)} Trip</button>` : ""}`}
      </section>`;
    }

    function spiritualFixedRow(label, group, index, done) {
      return `<label class="spiritual-check-row${done ? " done" : ""}">
        <input class="check" data-action="spiritual-fixed" data-group="${group}" ${index === null ? "" : `data-index="${index}"`} type="checkbox" ${done ? "checked" : ""} aria-label="Mark ${escapeHtml(label)} complete">
        <span>${escapeHtml(label)}</span>
      </label>`;
    }

    function spiritualManualRows(list, label) {
      return state.spiritual[list].map((item, index) => `<div class="spiritual-manual-row${item.done ? " done" : ""}">
        <input class="check" data-action="spiritual-manual-done" data-list="${list}" data-index="${index}" type="checkbox" ${item.done ? "checked" : ""} aria-label="Mark ${label} ${index + 1} complete">
        <div class="spiritual-fields">
          <input class="spiritual-text" data-action="spiritual-manual-text" data-list="${list}" data-index="${index}" type="text" value="${escapeHtml(item.text)}" maxlength="200" placeholder="${label}" aria-label="${label} ${index + 1}">
          <input class="spiritual-date" data-action="spiritual-manual-date" data-list="${list}" data-index="${index}" type="date" value="${escapeHtml(item.date)}" aria-label="Date for ${label} ${index + 1}">
        </div>
      </div>`).join("");
    }

    function spiritualMarkup() {
      const spiritual = state.spiritual;
      const dailyDone = spiritual.dailyTextDate === localDateKey();
      const dailyBibleReadingDone = spiritual.dailyBibleReadingDate === localDateKey();
      const midweekLabels = ["Bible Reading", "Spiritual Gems", "Living as Christians", "Congregation Bible Study"];
      const midweekCompleted = spiritual.midweekDone.filter(Boolean).length;
      const sundayCompleted = spiritual.sundayDone.slice(0, spiritual.sundaySubheadingCount).filter(Boolean).length
        + (spiritual.sundayReviewDone ? 1 : 0);
      const sundayTotal = spiritual.sundaySubheadingCount + 1;
      const upcomingCompleted = spiritual.upcomingParts.filter(item => item.done).length;
      const customCompleted = spiritual.customActivities.filter(item => item.done).length;
      const isOpen = group => spiritual.openGroups[group] ? " open" : "";

      return `<section class="panel spiritual${activeTab === "spiritual" ? " active" : ""}" data-panel="spiritual">
        <div class="section-head"><h2>Study &amp; Preparation</h2><span>Spiritual</span></div>
        <div class="daily-items">
          <label class="daily-text${dailyDone ? " done" : ""}">
            <input class="check" data-action="spiritual-daily" data-daily="text" type="checkbox" ${dailyDone ? "checked" : ""} aria-label="Mark Daily Text complete">
            <span>Daily Text</span>
          </label>
          <label class="daily-text${dailyBibleReadingDone ? " done" : ""}">
            <input class="check" data-action="spiritual-daily" data-daily="bible-reading" type="checkbox" ${dailyBibleReadingDone ? "checked" : ""} aria-label="Mark Daily Bible Reading complete">
            <span>Daily Bible Reading</span>
          </label>
        </div>
        <div class="spiritual-groups">
          <details class="spiritual-group" data-spiritual-group="midweek"${isOpen("midweek")}>
            <summary><span>Midweek Meeting</span><span class="group-progress" data-progress="midweek">${midweekCompleted} of 4</span></summary>
            <div class="spiritual-content">
              <div class="spiritual-list">
                ${midweekLabels.map((label, index) => spiritualFixedRow(label, "midweek", index, spiritual.midweekDone[index])).join("")}
              </div>
              <button class="spiritual-clear" data-action="spiritual-clear" data-group="midweek">Clear Midweek</button>
            </div>
          </details>
          <details class="spiritual-group" data-spiritual-group="sunday"${isOpen("sunday")}>
            <summary><span>Sunday Study</span><span class="group-progress" data-progress="sunday">${sundayCompleted} of ${sundayTotal}</span></summary>
            <div class="spiritual-content">
              <label class="sunday-count">Number of subheadings
                <select data-action="spiritual-sunday-count" aria-label="Number of Sunday subheadings">
                  ${[1, 2, 3, 4, 5].map(count => `<option value="${count}" ${count === spiritual.sundaySubheadingCount ? "selected" : ""}>${count}</option>`).join("")}
                </select>
              </label>
              <div class="spiritual-list">
                ${Array.from({ length: spiritual.sundaySubheadingCount }, (_, index) => spiritualFixedRow(`Subheading ${index + 1}`, "sunday", index, spiritual.sundayDone[index])).join("")}
                ${spiritualFixedRow("Review Questions", "review", null, spiritual.sundayReviewDone)}
              </div>
              <button class="spiritual-clear" data-action="spiritual-clear" data-group="sunday">Clear Sunday</button>
            </div>
          </details>
          <details class="spiritual-group" data-spiritual-group="upcoming"${isOpen("upcoming")}>
            <summary><span>Upcoming Parts</span><span class="group-progress" data-progress="upcomingParts">${upcomingCompleted} of 2</span></summary>
            <div class="spiritual-content">
              <div class="spiritual-list">${spiritualManualRows("upcomingParts", "Upcoming part")}</div>
              <button class="spiritual-clear" data-action="spiritual-clear-completed" data-list="upcomingParts">Clear Completed</button>
            </div>
          </details>
          <details class="spiritual-group" data-spiritual-group="custom"${isOpen("custom")}>
            <summary><span>Custom Activities</span><span class="group-progress" data-progress="customActivities">${customCompleted} of 2</span></summary>
            <div class="spiritual-content">
              <div class="spiritual-list">${spiritualManualRows("customActivities", "Custom activity")}</div>
              <button class="spiritual-clear" data-action="spiritual-clear-completed" data-list="customActivities">Clear Completed</button>
            </div>
          </details>
        </div>
      </section>`;
    }

    function updateSpiritualProgress(group) {
      const spiritual = state.spiritual;
      let key = group;
      let completed = 0;
      let total = 0;
      if (group === "midweek") {
        completed = spiritual.midweekDone.filter(Boolean).length;
        total = 4;
      } else if (group === "sunday" || group === "review") {
        key = "sunday";
        completed = spiritual.sundayDone.slice(0, spiritual.sundaySubheadingCount).filter(Boolean).length
          + (spiritual.sundayReviewDone ? 1 : 0);
        total = spiritual.sundaySubheadingCount + 1;
      } else {
        completed = spiritual[group].filter(item => item.done).length;
        total = 2;
      }
      const progress = main.querySelector(`[data-progress="${key}"]`);
      if (progress) progress.textContent = `${completed} of ${total}`;
    }

    function dataMarkup() {
      const visibleTabCount = configurableTabs.filter(tab => state.visibleTabs[tab.id]).length;
      return `<section class="panel data${activeTab === "data" ? " active" : ""}" data-panel="data">
        <div class="section-head"><h2>Data</h2><span>Lists, stores, and backup</span></div>
        <p class="helper">Edit these lists to change the choices available in the first three task positions of each section.</p>
        <div class="data-groups">
          <details class="data-group backup-data">
            <summary><span>Backup &amp; Restore</span><span class="group-progress">Local file</span></summary>
            <div class="data-group-content">
              <p class="helper">Save a complete copy of this device’s dashboard. Restoring a valid backup replaces all current dashboard data after confirmation.</p>
              <div class="backup-actions">
                <button class="backup-button primary" data-action="backup-export">Save Backup</button>
                <label class="backup-button">Restore Backup
                  <input class="backup-file" data-action="backup-restore" type="file" accept=".json,application/json">
                </label>
              </div>
              <p class="backup-status" id="backupStatus" aria-live="polite"></p>
            </div>
          </details>
          <details class="data-group appearance-data">
            <summary><span>Appearance</span><span class="group-progress" id="appearanceTheme">${THEME_LABELS[state.theme]}</span></summary>
            <div class="data-group-content">
              <p class="helper">Choose a color theme. The selection applies immediately and is saved with this dashboard.</p>
              <div class="theme-options" role="group" aria-label="Appearance theme">
                ${VALID_THEMES.map(theme => `<button class="theme-option" data-action="theme-select" data-theme="${theme}" type="button" aria-pressed="${state.theme === theme}">
                  <span class="theme-swatch swatch-${theme}" aria-hidden="true"></span>
                  <span>${THEME_LABELS[theme]}</span>
                  <span class="theme-selected" aria-hidden="true">✓</span>
                </button>`).join("")}
              </div>
            </div>
          </details>
          <details class="data-group visibility-data">
            <summary><span>Visible Tabs</span><span class="group-progress" id="visibilityProgress">${visibleTabCount} of ${configurableTabs.length}</span></summary>
            <div class="data-group-content">
              <p class="helper">Choose which functional tabs appear in the navigation bar. Hidden tabs keep all their saved data. Data always remains available.</p>
              <div class="visibility-list">
                ${configurableTabs.map(tab => `<label class="visibility-row">
                  <input data-action="tab-visibility" data-tab="${tab.id}" type="checkbox" ${state.visibleTabs[tab.id] ? "checked" : ""}>
                  <span>${tab.label}</span>
                </label>`).join("")}
              </div>
            </div>
          </details>
          ${sections.map(section => {
            const choiceCount = state.choices[section.id].filter(value => value.trim()).length;
            return `<details class="data-group ${section.id}-data">
              <summary><span>${section.title}</span><span class="group-progress">${choiceCount} choices</span></summary>
              <div class="data-group-content">
                <div class="choice-list">
                  ${state.choices[section.id].map((value, index) => `<div class="choice-row">
                    <label for="choice-${section.id}-${index}">${index + 1}</label>
                    <input id="choice-${section.id}-${index}" data-action="choice" data-section="${section.id}" data-index="${index}" value="${escapeHtml(value)}" placeholder="Available choice">
                  </div>`).join("")}
                </div>
              </div>
            </details>`;
          }).join("")}
          <h3 class="shopping-data-heading">Shopping Stores</h3>
          <p class="helper">Rename each store and maintain up to 100 reusable items. Blank positions stay out of the Shopping tab.</p>
          ${state.shopping.stores.map((store, storeIndex) => {
            const itemCount = storeItems(store).length;
            return `<details class="store-data-group"${storeIndex === 0 ? " open" : ""}>
              <summary><span>${escapeHtml(storeDisplayName(store, storeIndex))}</span><span class="group-progress">${itemCount} items</span></summary>
              <div class="store-data-content">
                <label class="store-name-label">Store name
                  <input data-action="store-name" data-store="${storeIndex}" value="${escapeHtml(store.name)}" maxlength="60" placeholder="Store ${storeIndex + 1}">
                </label>
                <button class="alphabetize-store" data-action="shopping-alphabetize" data-store="${storeIndex}">Alphabetize A–Z</button>
                <div class="choice-list">
                  ${store.items.map((value, itemIndex) => `<div class="choice-row">
                    <label for="store-${storeIndex}-item-${itemIndex}">${itemIndex + 1}</label>
                    <input id="store-${storeIndex}-item-${itemIndex}" data-action="shopping-item" data-store="${storeIndex}" data-index="${itemIndex}" value="${escapeHtml(value)}" maxlength="160" placeholder="Reusable shopping item">
                  </div>`).join("")}
                </div>
              </div>
            </details>`;
          }).join("")}
        </div>
      </section>`;
    }

    function tabIsVisible(tabId) {
      return tabId === "data" || Boolean(state.visibleTabs[tabId]);
    }

    function ensureVisibleActiveTab() {
      if (tabIsVisible(activeTab)) return;
      activeTab = configurableTabs.find(tab => state.visibleTabs[tab.id])?.id || "data";
    }

    function activePanelMarkup() {
      const section = sections.find(item => item.id === activeTab);
      if (section) return sectionMarkup(section);
      if (activeTab === "shopping") return shoppingMarkup();
      if (activeTab === "spiritual") return spiritualMarkup();
      return dataMarkup();
    }

    function updateTabNavigation() {
      document.querySelectorAll(".tab").forEach(button => {
        button.hidden = !tabIsVisible(button.dataset.tab);
        button.setAttribute("aria-selected", String(button.dataset.tab === activeTab));
      });
    }

    function render() {
      ensureVisibleActiveTab();
      main.innerHTML = activePanelMarkup();
      updateTabNavigation();
    }

    document.querySelector("nav").addEventListener("click", event => {
      const button = event.target.closest(".tab");
      if (!button) return;
      if (!tabIsVisible(button.dataset.tab)) return;
      activeTab = button.dataset.tab;
      render();
      requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "smooth" }));
    });

    main.addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const { action, store, mode, theme } = button.dataset;
      if (action === "backup-export") {
        await exportBackup();
        return;
      }
      if (action === "theme-select") {
        if (!VALID_THEMES.includes(theme)) return;
        state.theme = theme;
        applyTheme(theme);
        save();
        main.querySelectorAll('[data-action="theme-select"]').forEach(option => {
          option.setAttribute("aria-pressed", String(option.dataset.theme === theme));
        });
        const label = document.getElementById("appearanceTheme");
        if (label) label.textContent = THEME_LABELS[theme];
        return;
      }
      if (action === "shopping-alphabetize") {
        const storeIndex = Number(store);
        const currentStore = state.shopping.stores[storeIndex];
        alphabetizeStoreData(currentStore);
        save();
        const inputs = button.closest(".store-data-group").querySelectorAll('input[data-action="shopping-item"]');
        inputs.forEach(input => {
          input.value = currentStore.items[Number(input.dataset.index)];
        });
        button.textContent = "Alphabetized A–Z";
        setTimeout(() => {
          if (button.isConnected) button.textContent = "Alphabetize A–Z";
        }, 900);
        return;
      }
      if (action === "shopping-store") {
        state.shopping.activeStore = Number(store);
        save();
        render();
      }
      if (action === "shopping-mode") {
        state.shopping.mode = mode;
        save();
        render();
      }
      if (action === "shopping-finish") {
        const storeIndex = Number(store);
        const currentStore = state.shopping.stores[storeIndex];
        const name = storeDisplayName(currentStore, storeIndex);
        if (!window.confirm(`Finish the ${name} trip and clear every selected item?`)) return;
        currentStore.selected = {};
        currentStore.purchased = {};
        state.shopping.hidePurchased = false;
        save();
        render();
      }
      if (action === "spiritual-clear") {
        const group = button.dataset.group;
        const label = group === "midweek" ? "Midweek" : "Sunday";
        if (!window.confirm(`Clear all ${label} checkmarks?`)) return;
        if (group === "midweek") state.spiritual.midweekDone.fill(false);
        if (group === "sunday") {
          state.spiritual.sundayDone.fill(false);
          state.spiritual.sundayReviewDone = false;
        }
        save();
        render();
      }
      if (action === "spiritual-clear-completed") {
        const list = button.dataset.list;
        const completed = state.spiritual[list].filter(item => item.done).length;
        if (!completed) return;
        const label = list === "upcomingParts" ? "upcoming parts" : "custom activities";
        if (!window.confirm(`Clear ${completed} completed ${label}?`)) return;
        state.spiritual[list] = state.spiritual[list].map(item =>
          item.done ? { done: false, text: "", date: "" } : item
        );
        save();
        render();
      }
    });

    main.addEventListener("toggle", event => {
      const comingUp = event.target.closest?.("details[data-coming-up]");
      if (comingUp) {
        state.comingUpOpen = comingUp.open;
        save();
        return;
      }
      const details = event.target.closest?.("details[data-spiritual-group]");
      if (!details) return;
      state.spiritual.openGroups[details.dataset.spiritualGroup] = details.open;
      save();
    }, true);

    main.addEventListener("change", async event => {
      const control = event.target;
      const { action, section, index, store, group, list, tab, daily } = control.dataset;
      if (!action) return;
      if (action === "backup-restore") {
        const file = control.files?.[0];
        await restoreBackup(file);
        control.value = "";
        return;
      }
      if (action === "tab-visibility") {
        state.visibleTabs[tab] = control.checked;
        save();
        updateTabNavigation();
        const progress = document.getElementById("visibilityProgress");
        if (progress) {
          const count = configurableTabs.filter(item => state.visibleTabs[item.id]).length;
          progress.textContent = `${count} of ${configurableTabs.length}`;
        }
        return;
      }
      if (action === "spiritual-daily") {
        if (daily === "bible-reading") state.spiritual.dailyBibleReadingDate = control.checked ? localDateKey() : "";
        else state.spiritual.dailyTextDate = control.checked ? localDateKey() : "";
        save();
        control.closest(".daily-text").classList.toggle("done", control.checked);
        return;
      }
      if (action === "spiritual-fixed") {
        if (group === "midweek") state.spiritual.midweekDone[index] = control.checked;
        if (group === "sunday") state.spiritual.sundayDone[index] = control.checked;
        if (group === "review") state.spiritual.sundayReviewDone = control.checked;
        save();
        control.closest(".spiritual-check-row").classList.toggle("done", control.checked);
        updateSpiritualProgress(group);
        return;
      }
      if (action === "spiritual-sunday-count") {
        const requestedCount = Number(control.value);
        const count = Number.isInteger(requestedCount) ? Math.min(5, Math.max(1, requestedCount)) : 3;
        state.spiritual.sundaySubheadingCount = count;
        for (let hidden = count; hidden < 5; hidden += 1) state.spiritual.sundayDone[hidden] = false;
        save();
        render();
        return;
      }
      if (action === "spiritual-manual-done") {
        state.spiritual[list][index].done = control.checked;
        save();
        control.closest(".spiritual-manual-row").classList.toggle("done", control.checked);
        updateSpiritualProgress(list);
        return;
      }
      if (action === "spiritual-manual-date") {
        state.spiritual[list][index].date = control.value;
        save();
        return;
      }
      if (action === "coming-done") {
        state.comingUp[index].done = control.checked;
        save();
        control.closest(".coming-item").classList.toggle("done", control.checked);
        updateComingUpSummary();
        return;
      }
      if (action === "coming-date") {
        state.comingUp[index].date = control.value;
        save();
        updateComingUpSummary();
        return;
      }
      if (action === "shopping-select") {
        const currentStore = state.shopping.stores[Number(store)];
        if (control.checked) currentStore.selected[index] = true;
        else {
          delete currentStore.selected[index];
          delete currentStore.purchased[index];
        }
        save();
        render();
        return;
      }
      if (action === "shopping-purchased") {
        const currentStore = state.shopping.stores[Number(store)];
        if (control.checked) currentStore.purchased[index] = true;
        else delete currentStore.purchased[index];
        save();
        const row = control.closest(".shopping-item");
        row.classList.toggle("done", control.checked);
        const selected = selectedStoreItems(currentStore);
        const purchased = selected.reduce((count, item) => count + (currentStore.purchased[item.index] ? 1 : 0), 0);
        document.getElementById("shoppingProgress").textContent = `${purchased} of ${selected.length}`;
        if (state.shopping.hidePurchased && control.checked) {
          requestAnimationFrame(() => row.classList.add("removing"));
          setTimeout(() => {
            if (activeTab === "shopping") render();
          }, 230);
        }
        return;
      }
      if (action === "shopping-hide") {
        state.shopping.hidePurchased = control.checked;
        save();
        render();
        return;
      }
      if (action === "today-hide-completed") {
        state.hideCompletedToday = control.checked;
        save();
        render();
        return;
      }
      if (action === "task-done") {
        state.tasks[section][index].done = control.checked;
        save();
        const row = control.closest(".task");
        row.classList.toggle("done", control.checked);
        if (section === "today" && state.hideCompletedToday && control.checked) {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) row.remove();
          else {
            requestAnimationFrame(() => row.classList.add("removing"));
            setTimeout(() => row.remove(), 230);
          }
          if (state.tasks.today.every(task => task.done)) setTimeout(() => {
            if (activeTab === "today") render();
          }, 230);
        }
        return;
      }
      if (action === "task-value") state.tasks[section][index].value = control.value;
      if (action === "choice") state.choices[section][index] = control.value.trim();
      save();
    });

    main.addEventListener("input", event => {
      const control = event.target;
      const { action, section, index, store, list } = control.dataset;
      if (action === "task-value" && control.tagName === "INPUT") {
        state.tasks[section][index].value = control.value;
        save();
      }
      if (action === "choice") {
        state.choices[section][index] = control.value;
        save();
      }
      if (action === "store-name") {
        state.shopping.stores[Number(store)].name = control.value;
        save();
      }
      if (action === "shopping-item") {
        const currentStore = state.shopping.stores[Number(store)];
        currentStore.items[index] = control.value;
        if (!control.value.trim()) {
          delete currentStore.selected[index];
          delete currentStore.purchased[index];
        }
        save();
      }
      if (action === "coming-text") {
        state.comingUp[index].text = control.value;
        save();
        updateComingUpSummary();
      }
      if (action === "spiritual-manual-text") {
        state.spiritual[list][index].text = control.value;
        save();
      }
    });

    render();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && activeTab === "spiritual") render();
    });

    if ("serviceWorker" in navigator) {
      let updateInProgress = false;
      let reloadStarted = false;
      let hadController = Boolean(navigator.serviceWorker.controller);

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) {
          hadController = true;
          return;
        }
        if (reloadStarted) return;
        reloadStarted = true;
        window.location.reload();
      });

      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("./service-worker.js", {
            updateViaCache: "none"
          });

          const checkForUpdate = async () => {
            if (updateInProgress || !navigator.onLine) return;
            updateInProgress = true;
            try { await registration.update(); }
            catch { /* Stay on the current cached version if the check fails. */ }
            finally { updateInProgress = false; }
          };

          await checkForUpdate();

          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") checkForUpdate();
          });
          window.addEventListener("online", checkForUpdate);
        } catch {
          /* The dashboard still works normally if service-worker setup is unavailable. */
        }
      });
    }
  </script>
</body>
</html>
